<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AuraPK — Pakistan's Premier Online Store | Cash on Delivery</title>
    <meta name="description" content="Shop 100% authentic Pakistani fashion, lawn, gadgets, attar, cosmetics and leather with Cash on Delivery nationwide via TCS, Leopards & Trax." />
    <meta name="keywords" content="online shopping pakistan, cash on delivery, lawn suits, jazzcash, easypaisa, tcs tracking, lahore, karachi, islamabad" />
    
    <!-- PWA & Mobile Theme Color -->
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AuraPK" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="AuraPK — Pakistan's Premier Online Store" />
    <meta property="og:description" content="Shop authentic brands with Cash on Delivery & 24h Express Courier in Karachi, Lahore, Islamabad & 250+ cities." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Syne (Display) & Plus Jakarta Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        background-color: #080808;
      }
      .font-display {
        font-family: 'Syne', 'Plus Jakarta Sans', sans-serif;
      }
      /* Stroke text utilities */
      .stroke-text {
        -webkit-text-stroke: 1px currentColor;
      }
      .stroke-text-white {
        -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.9);
      }
      .stroke-text-emerald {
        -webkit-text-stroke: 1.5px #059669;
      }
      .stroke-text-thick {
        -webkit-text-stroke: 2px rgba(255, 255, 255, 0.9);
      }
      /* Hide scrollbars on custom slider bars */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
